services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: dispatch_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dispatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dispatch_dev}
      POSTGRES_DB: ${POSTGRES_DB:-dispatch}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dispatch_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  osrm:
    image: osrm/osrm-backend
    container_name: dispatch_osrm
    ports:
      - "5000:5000"
    volumes:
      - ./infra/osrm/data:/data
    command: "osrm-routed --algorithm mld /data/lebanon-latest.osrm"
    restart: unless-stopped
    profiles:
      - with-osrm

volumes:
  postgres_data:
  redis_data:
